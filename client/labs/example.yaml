name: advanced-lab
description: "Web cluster with load balancer"

networks:
  - name: lab-net
    ipv4: 10.100.1.1/24
    ipv6: none
    dns_domain: lab.local

profiles:
  - name: small-vm
    description: "Small VM profile"
    cpu: 2
    memory: "2GB"
    disk: "10GB"

instances:
  - name: load-balancer
    type: container
    image: images:alpine/3.20
    network: lab-net
    profiles: [default]
    
  - name: db-server
    type: virtual-machine
    image: images:ubuntu/22.04
    network: lab-net
    profiles: [default, small-vm]
    config:
      user.admin_password: "secret"