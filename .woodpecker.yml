when:
  - event: cron
    cron: sync-incus
  - event: manual
  - event: push
    branch: main

steps:
  # ------------------------------------------------------------
  # 1. Сборка Go AST parser
  # ------------------------------------------------------------
  - name: build-parser
    image: golang:1.22
    commands:
      - cd src/go-ast-parser
      - go build -o parser main.go
      - echo "✅ Go AST parser built"

  # ------------------------------------------------------------
  # 2. Мониторинг изменений Incus (без клонирования)
  # ------------------------------------------------------------
  - name: monitor-changes
    image: python:3.12-slim
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      INCUS_SOURCE_REPO:
        from_secret: incus_source_repo
    volumes:
      - /home/dev/woodpecker-state:/ci-state
    commands:
      - pip install --quiet PyGithub==2.5.0
      - mkdir -p state
      - mkdir -p /ci-state/incus-sync
      - |
        python -c "
        import json, os
        from pathlib import Path
        from src.monitor import run_monitor
        res = run_monitor(
            repo_name=os.environ['INCUS_SOURCE_REPO'],
            state_file=Path('/ci-state/incus-sync/.sync_state'),
            output_file=Path('state/changes.json'),
        )
        print(json.dumps(res, indent=2, ensure_ascii=False))

        Path('state').mkdir(exist_ok=True)
        if res.get('no_changes'):
            Path('state/.no_changes').write_text('true')
            print('NO_CHANGES detected')
        else:
            Path('state/.no_changes').write_text('false')
            Path('state/.incus_sha').write_text(res.get('last_sha', ''))
            api_count = len(res.get('api_changes', {}).get('files', []))
            client_count = len(res.get('client_changes', {}).get('files', []))
            Path('state/.api_changed_count').write_text(str(api_count))
            Path('state/.client_changed_count').write_text(str(client_count))
            print(f'Changes detected: API={api_count}, client={client_count}')
        "
      - echo "✅ Monitoring finished"
    depends_on:
      - build-parser

  # ------------------------------------------------------------
  # 3. Клонирование/обновление Incus source repo (shallow + cache)
  # ------------------------------------------------------------
  - name: clone-incus-source
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      INCUS_SOURCE_REPO:
        from_secret: incus_source_repo
    volumes:
      - /home/dev/woodpecker-state:/ci-state
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "⏭️  No changes detected, skipping Incus clone"
          exit 0
        fi
      - git config --global --add safe.directory '*'
      - mkdir -p /ci-state/incus-src
      - cd /ci-state/incus-src
      - |
        if [ -d ".git" ]; then
          echo "📦 Incus repo cache found, updating..."
          git fetch --depth=1 origin HEAD
          git reset --hard FETCH_HEAD
          git clean -fd
        else
          echo "📦 First clone of Incus repo (shallow)..."
          git clone --depth=1 "https://x-access-token:$${GITHUB_TOKEN}@github.com/$${INCUS_SOURCE_REPO}.git" .
        fi
      - echo "✅ Incus source repo ready"
    depends_on:
      - monitor-changes

  # ------------------------------------------------------------
  # 4. Генерация DTO (template-first + LLM repair)
  # ------------------------------------------------------------
  - name: generate-models
    image: rust:1.83
    environment:
      INCUS_REPO_PATH: /ci-state/incus-src
      OUTPUT_DIR: /woodpecker/src/github.com/NightSolist/dto_converter/generated_output
      OLLAMA_URL:
        from_secret: ollama_url
    volumes:
      - /home/dev/woodpecker-state:/ci-state
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "⏭️  No changes detected, skipping generation"
          exit 0
        fi
      - apt-get update -qq
      - apt-get install -y -qq python3 python3-pip
      - pip3 install --quiet --break-system-packages requests==2.32.3 Jinja2==3.1.4
      - rm -rf generated_output
      - mkdir -p generated_output
      - |
        python3 -c "
        import sys
        from src.pipeline import Pipeline
        sys.exit(0 if Pipeline().run() else 1)
        "
      - echo "✅ DTO generation completed"
      - |
        count=$$(find generated_output -maxdepth 1 -name "*.rs" | wc -l)
        echo "Generated files: $${count}"
        echo "$${count}" > state/.generated_count
    depends_on:
      - clone-incus-source

  # ------------------------------------------------------------
  # 5. Публикация Pull Request в Rust-репозиторий
  # ------------------------------------------------------------
  - name: publish-pr
    image: python:3.12-slim
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      RUST_TARGET_REPO:
        from_secret: rust_target_repo
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "⏭️  No changes detected, skipping PR publication"
          exit 0
        fi
      - pip install --quiet PyGithub==2.5.0
      - |
        python -c "
        import os
        from pathlib import Path
        from src.github_publisher import GitHubPublisher
        pub = GitHubPublisher(repo_name=os.environ['RUST_TARGET_REPO'])
        url = pub.publish(
            generated_dir=Path('generated_output'),
            target_path='src/incus/generated_prototype',
        )
        Path('state/.pr_url').write_text(url)
        print(f'PR created: {url}')
        "
      - echo "✅ Pull Request published"
    depends_on:
      - generate-models

  # ------------------------------------------------------------
  # 6. Обновление persistent state
  # ------------------------------------------------------------
  - name: update-state
    image: python:3.12-slim
    volumes:
      - /home/dev/woodpecker-state:/ci-state
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "⏭️  No changes detected, skipping state update"
          exit 0
        fi
      - |
        python -c "
        import json
        from pathlib import Path
        from src.state import save_state
        sha = json.loads(Path('state/changes.json').read_text(encoding='utf-8')).get('last_sha')
        if sha:
            save_state(sha, Path('/ci-state/incus-sync/.sync_state'))
            print(f'State updated: {sha}')
        "
      - echo "✅ Sync state updated"
    depends_on:
      - publish-pr

  # ------------------------------------------------------------
  # 7. Уведомление: успех (только если были изменения)
  # ------------------------------------------------------------
  - name: notify-success
    image: python:3.12-slim
    environment:
      SMTP_HOST:
        from_secret: smtp_host
      SMTP_PORT:
        from_secret: smtp_port
      SMTP_USER:
        from_secret: email_username
      SMTP_PASS:
        from_secret: smtp_pass
      NOTIFY_EMAIL:
        from_secret: email_recipient
      NOTIFY_FROM: "Incus Sync Bot"
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "⏭️  No changes detected — email is intentionally skipped"
          exit 0
        fi
      - |
        python -c "
        import os, smtplib, ssl
        from email.message import EmailMessage
        from pathlib import Path

        def read(path, default=''):
            p = Path(path)
            return p.read_text(encoding='utf-8').strip() if p.exists() else default

        pr_url          = read('state/.pr_url', '(нет PR)')
        incus_sha       = read('state/.incus_sha', '(не определён)')
        api_count       = read('state/.api_changed_count', '0')
        client_count    = read('state/.client_changed_count', '0')
        generated_count = read('state/.generated_count', '0')

        pipeline_number = os.environ.get('CI_PIPELINE_NUMBER', '?')
        pipeline_url    = os.environ.get('CI_PIPELINE_URL', '')
        repo            = os.environ.get('CI_REPO', '')
        commit_sha      = os.environ.get('CI_COMMIT_SHA', '')
        branch          = os.environ.get('CI_COMMIT_BRANCH', '')

        smtp_host    = os.environ['SMTP_HOST']
        smtp_port    = int(os.environ['SMTP_PORT'])
        smtp_user    = os.environ['SMTP_USER']
        smtp_pass    = os.environ['SMTP_PASS']
        notify_email = os.environ['NOTIFY_EMAIL']
        from_name    = os.environ.get('NOTIFY_FROM', 'Incus Sync Bot')

        subject = f'✅ Incus Sync: PR создан (pipeline #{pipeline_number})'

        body = (
            'Здравствуйте!\n\n'
            'Pipeline синхронизации Incus -> Rust успешно завершён.\n\n'
            'Что было выполнено:\n'
            '  • Мониторинг изменений Go-репозитория Incus\n'
            '  • AST-парсинг Go-моделей\n'
            '  • Шаблонная генерация Rust DTO (template-first)\n'
            '  • LLM repair шаблонного результата при необходимости\n'
            '  • Публикация Pull Request в целевой Rust-репозиторий\n\n'
            'После публикации PR качество кода проверяет независимый\n'
            'CI потребителя (incus-lab-manager):\n'
            '  cargo check, cargo fmt --check, cargo test --test serde_dto.\n\n'
            'Сводка:\n'
            f'  • Репозиторий генератора: {repo}\n'
            f'  • Pipeline: {pipeline_url}\n'
            f'  • Коммит генератора: {commit_sha}\n'
            f'  • Ветка: {branch}\n'
            f'  • Коммит Incus: {incus_sha}\n'
            f'  • Изменённых API-файлов: {api_count}\n'
            f'  • Изменений в client/: {client_count}\n'
            f'  • Сгенерировано Rust-файлов: {generated_count}\n'
            f'  • Pull Request: {pr_url}\n\n'
            '—\n'
            'Incus Sync Bot\n'
        )

        msg = EmailMessage()
        msg['Subject'] = subject
        msg['From']    = f'{from_name} <{smtp_user}>'
        msg['To']      = notify_email
        msg.set_content(body)

        ctx = ssl.create_default_context()
        if smtp_port == 465:
            with smtplib.SMTP_SSL(smtp_host, smtp_port, context=ctx) as s:
                s.login(smtp_user, smtp_pass)
                s.send_message(msg)
        else:
            with smtplib.SMTP(smtp_host, smtp_port) as s:
                s.starttls(context=ctx)
                s.login(smtp_user, smtp_pass)
                s.send_message(msg)

        print(f'✅ Success email sent to {notify_email}')
        "
    when:
      - status: success
    depends_on:
      - update-state

  # ------------------------------------------------------------
  # 8. Уведомление: ошибка (всегда при отказе любого шага)
  # ------------------------------------------------------------
  - name: notify-failure
    image: python:3.12-slim
    environment:
      SMTP_HOST:
        from_secret: smtp_host
      SMTP_PORT:
        from_secret: smtp_port
      SMTP_USER:
        from_secret: email_username
      SMTP_PASS:
        from_secret: smtp_pass
      NOTIFY_EMAIL:
        from_secret: email_recipient
      NOTIFY_FROM: "Incus Sync Bot"
    commands:
      - |
        python -c "
        import os, smtplib, ssl
        from email.message import EmailMessage
        from pathlib import Path

        def read(path, default=''):
            p = Path(path)
            return p.read_text(encoding='utf-8').strip() if p.exists() else default

        pr_url    = read('state/.pr_url', '(PR не создан)')
        incus_sha = read('state/.incus_sha', '(не определён)')

        pipeline_number = os.environ.get('CI_PIPELINE_NUMBER', '?')
        pipeline_url    = os.environ.get('CI_PIPELINE_URL', '')
        repo            = os.environ.get('CI_REPO', '')
        commit_sha      = os.environ.get('CI_COMMIT_SHA', '')
        branch          = os.environ.get('CI_COMMIT_BRANCH', '')

        smtp_host    = os.environ['SMTP_HOST']
        smtp_port    = int(os.environ['SMTP_PORT'])
        smtp_user    = os.environ['SMTP_USER']
        smtp_pass    = os.environ['SMTP_PASS']
        notify_email = os.environ['NOTIFY_EMAIL']
        from_name    = os.environ.get('NOTIFY_FROM', 'Incus Sync Bot')

        subject = f'⚠️ Incus Sync: ошибка синхронизации (pipeline #{pipeline_number})'

        body = (
            'Здравствуйте!\n\n'
            'Pipeline синхронизации Incus -> Rust завершился с ошибкой.\n\n'
            'Возможные этапы отказа:\n'
            '  • Мониторинг изменений\n'
            '  • Клонирование Incus\n'
            '  • Генерация DTO\n'
            '  • LLM repair\n'
            '  • Публикация PR\n'
            '  • Обновление состояния\n\n'
            'Сводка:\n'
            f'  • Репозиторий генератора: {repo}\n'
            f'  • Pipeline: {pipeline_url}\n'
            f'  • Коммит генератора: {commit_sha}\n'
            f'  • Ветка: {branch}\n'
            f'  • Коммит Incus: {incus_sha}\n'
            f'  • PR (если успел создаться): {pr_url}\n\n'
            'Требуется анализ логов pipeline.\n\n'
            '—\n'
            'Incus Sync Bot\n'
        )

        msg = EmailMessage()
        msg['Subject'] = subject
        msg['From']    = f'{from_name} <{smtp_user}>'
        msg['To']      = notify_email
        msg.set_content(body)

        ctx = ssl.create_default_context()
        if smtp_port == 465:
            with smtplib.SMTP_SSL(smtp_host, smtp_port, context=ctx) as s:
                s.login(smtp_user, smtp_pass)
                s.send_message(msg)
        else:
            with smtplib.SMTP(smtp_host, smtp_port) as s:
                s.starttls(context=ctx)
                s.login(smtp_user, smtp_pass)
                s.send_message(msg)

        print(f'⚠️ Failure email sent to {notify_email}')
        "
    when:
      - status: failure