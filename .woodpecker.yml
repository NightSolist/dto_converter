when:
  - event: cron
    cron: sync-incus
  - event: manual
  - event: push
    branch: main

steps:
  # ------------------------------------------------------------
  # 1. Сборка Go AST parser
  # ------------------------------------------------------------
  - name: build-parser
    image: golang:1.22
    commands:
      - cd src/go-ast-parser
      - go build -o parser main.go
      - echo "✅ Go AST parser built"

  - name: debug-secrets
    image: alpine:3.20
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      INCUS_SOURCE_REPO:
        from_secret: incus_source_repo
    commands:
      - 'echo "Token length: ${#GITHUB_TOKEN}"'
      - 'echo "Repo: [${INCUS_SOURCE_REPO}]"'
      - 'echo "First 4 chars of token: ${GITHUB_TOKEN:0:4}"'
    depends_on:
      - build-parser

  # ------------------------------------------------------------
  # 2. Клонирование Incus source repo
  # ------------------------------------------------------------
  - name: clone-incus-source
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      INCUS_SOURCE_REPO:
        from_secret: incus_source_repo
    commands:
      - rm -rf incus-src
      - git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${INCUS_SOURCE_REPO}.git" incus-src
      - echo "✅ Incus source repo cloned"
    depends_on:
      - build-parser

  # ------------------------------------------------------------
  # 3. Мониторинг изменений
  # ------------------------------------------------------------
  - name: monitor-changes
    image: python:3.12-slim
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      INCUS_SOURCE_REPO:
        from_secret: incus_source_repo
      SYNC_STATE_FILE: /ci-state/incus-sync/.sync_state
    commands:
      - pip install --quiet PyGithub==2.5.0
      - mkdir -p state
      - mkdir -p /ci-state/incus-sync
      - |
        python -c "
        import json, os
        from pathlib import Path
        from src.monitor import run_monitor
        res = run_monitor(repo_name=os.environ['INCUS_SOURCE_REPO'], state_file=Path(os.environ['SYNC_STATE_FILE']), output_file=Path('state/changes.json'))
        print(json.dumps(res, indent=2, ensure_ascii=False))
        with open(os.environ.get('CI_ENV_FILE', '/dev/null'), 'a', encoding='utf-8') as f:
            if res.get('no_changes'):
                f.write('NO_CHANGES=true\n')
            else:
                f.write('NO_CHANGES=false\n')
                f.write(f\"INCUS_SHA={res.get('last_sha', '')}\n\")
                f.write(f\"API_CHANGED_COUNT={len(res.get('api_changes', {}).get('files', []))}\n\")
                f.write(f\"CLIENT_CHANGED_COUNT={len(res.get('client_changes', {}).get('files', []))}\n\")
        "
      - echo "✅ Monitoring finished"
    depends_on:
      - clone-incus-source

  # ------------------------------------------------------------
  # 4. Генерация DTO и валидация генератора
  # ------------------------------------------------------------
  - name: generate-models
    image: rust:1.83
    environment:
      INCUS_REPO_PATH: /woodpecker/src/incus-src
      OUTPUT_DIR: /woodpecker/src/generated_output
      OLLAMA_URL:
        from_secret: ollama_url
    commands:
      - apt-get update -qq
      - apt-get install -y -qq python3 python3-pip
      - pip3 install --quiet --break-system-packages requests==2.32.3 Jinja2==3.1.4
      - rm -rf generated_output
      - mkdir -p generated_output
      - |
        python3 -c "
        import sys
        from src.pipeline import Pipeline
        sys.exit(0 if Pipeline().run() else 1)
        "
      - echo "✅ DTO generation completed"
      - |
        count=$(find generated_output -maxdepth 1 -name "*.rs" | wc -l)
        echo "GENERATED_COUNT=${count}" >> "${CI_ENV_FILE}"
    when:
      evaluate: 'NO_CHANGES != "true"'
    depends_on:
      - monitor-changes

  # ------------------------------------------------------------
  # 5. Клонирование целевого Rust-репозитория
  # ------------------------------------------------------------
  - name: clone-rust-target
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      RUST_TARGET_REPO:
        from_secret: rust_target_repo
    commands:
      - rm -rf target-rust
      - git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${RUST_TARGET_REPO}.git" target-rust
      - echo "✅ Rust target repo cloned"
    when:
      evaluate: 'NO_CHANGES != "true"'
    depends_on:
      - generate-models

  # ------------------------------------------------------------
  # 6. Подмена generated_prototype в целевом Rust-репозитории
  # ------------------------------------------------------------
  - name: inject-generated
    image: alpine:3.20
    commands:
      - rm -rf target-rust/src/incus/generated_prototype/*.rs
      - cp generated_output/*.rs target-rust/src/incus/generated_prototype/
      - echo "✅ Generated files copied into Rust target repo"
    when:
      evaluate: 'NO_CHANGES != "true"'
    depends_on:
      - clone-rust-target

  # ------------------------------------------------------------
  # 7. Форматирование Rust-кода
  # ------------------------------------------------------------
  - name: rustfmt
    image: rust:1.83
    commands:
      - rustup component add rustfmt
      - cd target-rust
      - cargo fmt --all
      - echo "✅ Rust code formatted"
      - cp src/incus/generated_prototype/*.rs ../generated_output/
    when:
      evaluate: 'NO_CHANGES != "true"'
    depends_on:
      - inject-generated

  # ------------------------------------------------------------
  # 8. Компиляционная проверка Rust-репозитория
  # ------------------------------------------------------------
  - name: cargo-check
    image: rust:1.83
    commands:
      - cd target-rust
      - cargo check --all-targets
      - echo "✅ cargo check passed"
    when:
      evaluate: 'NO_CHANGES != "true"'
    depends_on:
      - rustfmt

  # ------------------------------------------------------------
  # 9. Unit-тесты DTO
  # ------------------------------------------------------------
  - name: cargo-test-serde
    image: rust:1.83
    commands:
      - cd target-rust
      - cargo test --test serde_dto -- --nocapture
      - echo "✅ serde DTO tests passed"
    when:
      evaluate: 'NO_CHANGES != "true"'
    depends_on:
      - cargo-check

  # ------------------------------------------------------------
  # 10. Публикация Pull Request
  # ------------------------------------------------------------
  - name: publish-pr
    image: python:3.12-slim
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      RUST_TARGET_REPO:
        from_secret: rust_target_repo
    commands:
      - pip install --quiet PyGithub==2.5.0
      - |
        python -c "
        import os
        from pathlib import Path
        from src.github_publisher import GitHubPublisher
        pub = GitHubPublisher(repo_name=os.environ['RUST_TARGET_REPO'])
        url = pub.publish(generated_dir=Path('generated_output'), target_path='src/incus/generated_prototype')
        with open(os.environ.get('CI_ENV_FILE', '/dev/null'), 'a', encoding='utf-8') as f:
            f.write(f'PR_URL={url}\\n')
        print(f'PR created: {url}')
        "
      - echo "✅ Pull Request published"
    when:
      evaluate: 'NO_CHANGES != "true"'
    depends_on:
      - cargo-test-serde

  # ------------------------------------------------------------
  # 11. Обновление persistent state
  # ------------------------------------------------------------
  - name: update-state
    image: python:3.12-slim
    environment:
      SYNC_STATE_FILE: /ci-state/incus-sync/.sync_state
    commands:
      - |
        python -c "
        import json, os
        from pathlib import Path
        from src.monitor import save_state
        sha = json.loads(Path('state/changes.json').read_text(encoding='utf-8')).get('last_sha')
        if sha:
            save_state(sha, Path(os.environ['SYNC_STATE_FILE']))
            print(f'State updated: {sha}')
        "
      - echo "✅ Sync state updated"
    when:
      evaluate: 'NO_CHANGES != "true"'
    depends_on:
      - publish-pr

  # ------------------------------------------------------------
  # 12. Уведомление: успех
  # ------------------------------------------------------------
  - name: notify-success
    image: deblan/woodpecker-email
    settings:
      dsn:
        from_secret: email_dsn
      from:
        address:
          from_secret: email_username
        name: Incus Sync Bot
      recipients:
        from_secret: email_recipient
      recipients_only: true
      content_type: text/plain
      subject: "✅ Incus Sync: синхронизация выполнена (pipeline #${CI_PIPELINE_NUMBER})"
      body: |
        Здравствуйте!

        Pipeline Incus Model Sync успешно завершён.

        Сводка:
          • Коммит Incus: ${INCUS_SHA}
          • Изменённых API-файлов: ${API_CHANGED_COUNT}
          • Сгенерировано Rust-файлов: ${GENERATED_COUNT}
          • Pull Request: ${PR_URL}
          • Pipeline: ${CI_PIPELINE_URL}

        —
        Incus Sync Bot
    when:
      - status: success
        evaluate: 'NO_CHANGES != "true"'
    depends_on:
      - update-state

  # ------------------------------------------------------------
  # 13. Уведомление: ошибка
  # ------------------------------------------------------------
  - name: notify-failure
    image: deblan/woodpecker-email
    settings:
      dsn:
        from_secret: email_dsn
      from:
        address:
          from_secret: email_username
        name: Incus Sync Bot
      recipients:
        from_secret: email_recipient
      recipients_only: true
      content_type: text/plain
      subject: "⚠️ Incus Sync: ошибка синхронизации (pipeline #${CI_PIPELINE_NUMBER})"
      body: |
        Здравствуйте!

        Pipeline Incus Model Sync завершился с ошибкой.

        Сводка:
          • Коммит Incus: ${INCUS_SHA}
          • Pipeline: ${CI_PIPELINE_URL}
          • PR (если успел): ${PR_URL}

        Требуется анализ логов pipeline.

        —
        Incus Sync Bot
    when:
      - status: failure