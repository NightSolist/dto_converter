when:
  - event: cron
    cron: sync-incus
  - event: manual
  - event: push
    branch: main

steps:
  # ------------------------------------------------------------
  # 1. Сборка Go AST parser
  # ------------------------------------------------------------
  - name: build-parser
    image: golang:1.22
    commands:
      - cd src/go-ast-parser
      - go build -o parser main.go
      - echo "Go AST parser built"

  # ------------------------------------------------------------
  # 2. Мониторинг изменений Incus
  # ------------------------------------------------------------
  - name: monitor-changes
    image: python:3.12-slim
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      INCUS_SOURCE_REPO:
        from_secret: incus_source_repo
    volumes:
      - /home/dev/woodpecker-state:/ci-state
    commands:
      - pip install --quiet PyGithub==2.5.0
      - mkdir -p state
      - mkdir -p /ci-state/incus-sync
      - |
        python -u -c "
        import json, os
        from pathlib import Path
        from src.monitor import run_monitor

        res = run_monitor(
            repo_name=os.environ['INCUS_SOURCE_REPO'],
            state_file=Path('/ci-state/incus-sync/.sync_state'),
            output_file=Path('state/changes.json'),
        )
        print(json.dumps(res, indent=2, ensure_ascii=False))

        Path('state').mkdir(exist_ok=True)

        api_files = [
            f['path']
            for f in res.get('api_changes', {}).get('files', [])
        ]
        client_files = [
            f['path']
            for f in res.get('client_changes', {}).get('files', [])
        ]

        if res.get('no_changes'):
            Path('state/.no_changes').write_text('true', encoding='utf-8')
            Path('state/.api_changed_files').write_text('', encoding='utf-8')
            Path('state/.client_changed_files').write_text('', encoding='utf-8')
            print('NO_CHANGES detected')
        else:
            Path('state/.no_changes').write_text('false', encoding='utf-8')
            Path('state/.incus_sha').write_text(res.get('last_sha', ''), encoding='utf-8')
            Path('state/.api_changed_count').write_text(str(len(api_files)), encoding='utf-8')
            Path('state/.client_changed_count').write_text(str(len(client_files)), encoding='utf-8')
            Path('state/.api_changed_files').write_text('\n'.join(api_files), encoding='utf-8')
            Path('state/.client_changed_files').write_text('\n'.join(client_files), encoding='utf-8')
            print(f'Changes detected: API={len(api_files)}, client={len(client_files)}')
        "
      - echo "Monitoring finished"

  # ------------------------------------------------------------
  # 3. Клонирование/обновление Incus source repo
  # ------------------------------------------------------------
  - name: clone-incus-source
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      INCUS_SOURCE_REPO:
        from_secret: incus_source_repo
    volumes:
      - /home/dev/woodpecker-state:/ci-state
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "No changes detected, skipping Incus clone"
          exit 0
        fi
      - git config --global --add safe.directory '*'
      - mkdir -p /ci-state/incus-src
      - cd /ci-state/incus-src
      - |
        if [ -d ".git" ]; then
          echo "Incus repo cache found, updating..."
          git fetch --depth=1 origin HEAD
          git reset --hard FETCH_HEAD
          git clean -fd
        else
          echo "First clone of Incus repo (shallow)..."
          git clone --depth=1 "https://x-access-token:$${GITHUB_TOKEN}@github.com/$${INCUS_SOURCE_REPO}.git" .
        fi
      - echo "Incus source repo ready"
    depends_on:
      - monitor-changes

  # ------------------------------------------------------------
  # 4. Генерация DTO
  # ------------------------------------------------------------
  - name: generate-models
    image: python:3.12-slim
    environment:
      INCUS_REPO_PATH: /ci-state/incus-src
      OUTPUT_DIR: /woodpecker/src/github.com/NightSolist/dto_converter/generated_output
      OLLAMA_URL:
        from_secret: ollama_url
      OLLAMA_TIMEOUT: "300"
      PYTHONUNBUFFERED: "1"
    volumes:
      - /home/dev/woodpecker-state:/ci-state
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "No changes detected, skipping generation"
          exit 0
        fi
      - apt-get update -qq
      - apt-get install -y -qq --no-install-recommends curl build-essential ca-certificates
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.83.0 --profile minimal
      - . "$HOME/.cargo/env"
      - rustc --version
      - cargo --version
      - pip install --quiet --no-cache-dir Jinja2==3.1.4 requests==2.32.3
      - |
        echo "Warming up Ollama model..."
        curl -s "$${OLLAMA_URL}" \
          -d '{"model":"qwen2.5-coder:1.5b","messages":[{"role":"user","content":"hi"}],"stream":false,"keep_alive":"10m"}' \
          --max-time 300 || echo "Warmup failed, continuing anyway"
      - rm -rf generated_output
      - mkdir -p generated_output
      - |
        . "$HOME/.cargo/env"
        python -u -c "
        import sys
        from src.pipeline import Pipeline
        sys.exit(0 if Pipeline().run() else 1)
        "
      - echo "DTO generation completed"
      - |
        count=$$(find generated_output -maxdepth 1 -name "*.rs" | wc -l)
        echo "Generated files: $${count}"
        echo "$${count}" > state/.generated_count
    depends_on:
      - clone-incus-source

  # ------------------------------------------------------------
  # 5. Форматирование сгенерированных Rust-файлов
  # ------------------------------------------------------------
  - name: rustfmt-generated
    image: rust:1.83
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "No changes detected, skipping rustfmt"
          exit 0
        fi
      - rustup component add rustfmt
      - |
        for f in generated_output/*.rs; do
          echo "Formatting $f"
          rustfmt --edition 2021 "$f"
        done
      - echo "Generated Rust files formatted"
    depends_on:
      - generate-models

  # ------------------------------------------------------------
  # 6. Публикация Pull Request
  # ------------------------------------------------------------
  - name: publish-pr
    image: python:3.12-slim
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      RUST_TARGET_REPO:
        from_secret: rust_target_repo
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "No changes detected, skipping PR publication"
          exit 0
        fi
      - pip install --quiet PyGithub==2.5.0
      - |
        python -u -c "
        import os
        from pathlib import Path
        from src.github_publisher import GitHubPublisher

        pub = GitHubPublisher(repo_name=os.environ['RUST_TARGET_REPO'])
        result = pub.publish(
            generated_dir=Path('generated_output'),
            target_path='src/incus/generated_prototype',
        )

        Path('state').mkdir(exist_ok=True)

        Path('state/.generated_files').write_text(
            '\n'.join(result.generated_files),
            encoding='utf-8',
        )
        Path('state/.changed_rust_files').write_text(
            '\n'.join(result.changed_files),
            encoding='utf-8',
        )

        if result.skipped_no_diff:
            Path('state/.no_rust_diff').write_text('true', encoding='utf-8')
            Path('state/.pr_url').write_text('', encoding='utf-8')
            print('No Rust diff relative to target main; PR was not created.')
        else:
            Path('state/.no_rust_diff').write_text('false', encoding='utf-8')
            Path('state/.pr_url').write_text(result.pr_url or '', encoding='utf-8')
            print(f'PR created: {result.pr_url}')
        "
      - echo "Publish stage finished"
    depends_on:
      - rustfmt-generated

  # ------------------------------------------------------------
  # 7. Триггер lab CI
  # ------------------------------------------------------------
  - name: trigger-lab-ci
    image: python:3.12-slim
    environment:
      WOODPECKER_URL:
        from_secret: woodpecker_url
      WOODPECKER_TOKEN:
        from_secret: woodpecker_token
      WOODPECKER_REPO:
        from_secret: woodpecker_repo
      GITHUB_TOKEN:
        from_secret: github_token
      RUST_TARGET_REPO:
        from_secret: rust_target_repo
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "No changes detected, skipping lab CI trigger"
          exit 0
        fi
      - |
        if [ "$(cat state/.no_rust_diff 2>/dev/null)" = "true" ]; then
          echo "No Rust diff, no PR was created — skipping lab CI"
          exit 0
        fi
      - pip install --quiet requests==2.32.3 PyGithub==2.5.0
      - |
        python -u -c "
        import os
        from pathlib import Path
        from github import Auth, Github
        from src.woodpecker_trigger import WoodpeckerTrigger

        pr_url = Path('state/.pr_url').read_text(encoding='utf-8').strip()
        if not pr_url:
            print('No PR URL stored, nothing to trigger')
            raise SystemExit(0)

        pr_number = pr_url.rstrip('/').split('/')[-1]

        gh = Github(auth=Auth.Token(os.environ['GITHUB_TOKEN']))
        repo = gh.get_repo(os.environ['RUST_TARGET_REPO'])
        pr = repo.get_pull(int(pr_number))
        branch = pr.head.ref
        print(f'PR #{pr_number} branch: {branch}')

        trigger = WoodpeckerTrigger()
        url = trigger.trigger_pipeline(branch=branch)
        print(f'Triggered: {url}')
        "
      - echo "Lab CI pipeline triggered successfully"
    depends_on:
      - publish-pr

  # ------------------------------------------------------------
  # 8. Обновление persistent state
  # ------------------------------------------------------------
  - name: update-state
    image: python:3.12-slim
    volumes:
      - /home/dev/woodpecker-state:/ci-state
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "No changes detected, skipping state update"
          exit 0
        fi
      - |
        python -u -c "
        import json
        from pathlib import Path
        from src.state import save_state
        sha = json.loads(Path('state/changes.json').read_text(encoding='utf-8')).get('last_sha')
        if sha:
            save_state(sha, Path('/ci-state/incus-sync/.sync_state'))
            print(f'State updated: {sha}')
        "
      - echo "Sync state updated"
    depends_on:
      - publish-pr

  # ------------------------------------------------------------
  # 9. Уведомление: успех (с учётом частичных провалов)
  # ------------------------------------------------------------
  - name: notify-success
    image: python:3.12-slim
    environment:
      SMTP_HOST:
        from_secret: smtp_host
      SMTP_PORT:
        from_secret: smtp_port
      SMTP_USER:
        from_secret: email_username
      SMTP_PASS:
        from_secret: smtp_pass
      NOTIFY_EMAIL:
        from_secret: email_recipient
      NOTIFY_FROM: "Incus Sync Bot"
    commands:
      - |
        if [ "$(cat state/.no_changes 2>/dev/null)" = "true" ]; then
          echo "No changes detected, email is intentionally skipped"
          exit 0
        fi
      - |
        python -u -c "
        import os, json, smtplib, ssl
        from email.message import EmailMessage
        from pathlib import Path

        def read(path, default=''):
            p = Path(path)
            return p.read_text(encoding='utf-8').strip() if p.exists() else default

        def read_lines(path):
            p = Path(path)
            if not p.exists():
                return []
            return [
                line.strip()
                for line in p.read_text(encoding='utf-8').splitlines()
                if line.strip()
            ]

        def read_json(path):
            p = Path(path)
            if not p.exists():
                return []
            try:
                return json.loads(p.read_text(encoding='utf-8'))
            except Exception:
                return []

        def bullet_list(items, empty='  (нет)'):
            if not items:
                return empty
            return '\n'.join(f'  - {item}' for item in items)

        pr_url = read('state/.pr_url', '')
        incus_sha = read('state/.incus_sha', '(не определён)')
        no_rust_diff = read('state/.no_rust_diff', 'false') == 'true'

        api_files = read_lines('state/.api_changed_files')
        client_files = read_lines('state/.client_changed_files')
        generated_files = read_lines('state/.generated_files')
        changed_rust_files = read_lines('state/.changed_rust_files')
        failed_entities = read_json('state/.failed_entities.json')

        pipeline_number = os.environ.get('CI_PIPELINE_NUMBER', '?')
        pipeline_url = os.environ.get('CI_PIPELINE_URL', '')
        repo = os.environ.get('CI_REPO', '')

        smtp_host = os.environ['SMTP_HOST']
        smtp_port = int(os.environ['SMTP_PORT'])
        smtp_user = os.environ['SMTP_USER']
        smtp_pass = os.environ['SMTP_PASS']
        notify_email = os.environ['NOTIFY_EMAIL']
        from_name = os.environ.get('NOTIFY_FROM', 'Incus Sync Bot')

        if failed_entities:
            subject = (
                f'Incus Sync: синхронизация выполнена, требуется ручная '
                f'обработка {len(failed_entities)} сущностей '
                f'(pipeline #{pipeline_number})'
            )
        elif no_rust_diff:
            subject = (
                f'Incus Sync: синхронизация выполнена, '
                f'изменений в Rust DTO нет (pipeline #{pipeline_number})'
            )
        else:
            subject = (
                f'Incus Sync: синхронизация выполнена, '
                f'PR создан (pipeline #{pipeline_number})'
            )

        if no_rust_diff:
            pr_line = '  - Pull Request: не создавался (diff отсутствует)'
        else:
            pr_line = f'  - Pull Request: {pr_url}'

        if failed_entities:
            failed_block = '\nТребуют ручной обработки:\n'
            for item in failed_entities:
                name = item.get('name', '?')
                kind = item.get('kind', '?')
                error = item.get('error', '')
                if len(error) > 200:
                    error = error[:200] + '...'
                failed_block += f'  - {name} ({kind})\n'
                failed_block += f'    Причина: {error}\n'
            failed_block += '\nДля этих сущностей требуется ручная синхронизация.\n'
        else:
            failed_block = ''

        body = (
            'Здравствуйте!\n\n'
            'Автоматическая синхронизация моделей Incus -> Rust выполнена.\n\n'
            'Изменившиеся Go-файлы:\n'
            f'{bullet_list(api_files + client_files)}\n\n'
            'Сгенерированные Rust-файлы:\n'
            f'{bullet_list(generated_files)}\n\n'
            'Rust-файлы, реально отличающиеся от main:\n'
            f'{bullet_list(changed_rust_files)}\n'
            f'{failed_block}'
            '\nСсылки и сводка:\n'
            f'{pr_line}\n'
            f'  - Pipeline: {pipeline_url}\n'
            f'  - Репозиторий генератора: {repo}\n'
            f'  - Коммит Incus: {incus_sha}\n\n'
            '--\n'
            'Incus Sync Bot\n'
        )

        msg = EmailMessage()
        msg['Subject'] = subject
        msg['From'] = f'{from_name} <{smtp_user}>'
        msg['To'] = notify_email
        msg.set_content(body)

        ctx = ssl.create_default_context()
        if smtp_port == 465:
            with smtplib.SMTP_SSL(smtp_host, smtp_port, context=ctx) as s:
                s.login(smtp_user, smtp_pass)
                s.send_message(msg)
        else:
            with smtplib.SMTP(smtp_host, smtp_port) as s:
                s.starttls(context=ctx)
                s.login(smtp_user, smtp_pass)
                s.send_message(msg)

        print(f'Success email sent to {notify_email}')
        "
    when:
      - status: success
    depends_on:
      - update-state

  # ------------------------------------------------------------
  # 10. Уведомление: ошибка pipeline (катастрофическое падение)
  # ------------------------------------------------------------
  - name: notify-failure
    image: python:3.12-slim
    environment:
      SMTP_HOST:
        from_secret: smtp_host
      SMTP_PORT:
        from_secret: smtp_port
      SMTP_USER:
        from_secret: email_username
      SMTP_PASS:
        from_secret: smtp_pass
      NOTIFY_EMAIL:
        from_secret: email_recipient
      NOTIFY_FROM: "Incus Sync Bot"
    commands:
      - |
        python -u -c "
        import os, smtplib, ssl
        from email.message import EmailMessage
        from pathlib import Path

        def read(path, default=''):
            p = Path(path)
            return p.read_text(encoding='utf-8').strip() if p.exists() else default

        pr_url = read('state/.pr_url', '(PR не создан)')
        incus_sha = read('state/.incus_sha', '(не определён)')

        pipeline_number = os.environ.get('CI_PIPELINE_NUMBER', '?')
        pipeline_url = os.environ.get('CI_PIPELINE_URL', '')
        repo = os.environ.get('CI_REPO', '')
        commit_sha = os.environ.get('CI_COMMIT_SHA', '')
        branch = os.environ.get('CI_COMMIT_BRANCH', '')

        smtp_host = os.environ['SMTP_HOST']
        smtp_port = int(os.environ['SMTP_PORT'])
        smtp_user = os.environ['SMTP_USER']
        smtp_pass = os.environ['SMTP_PASS']
        notify_email = os.environ['NOTIFY_EMAIL']
        from_name = os.environ.get('NOTIFY_FROM', 'Incus Sync Bot')

        subject = f'Incus Sync: критическая ошибка pipeline (pipeline #{pipeline_number})'

        body = (
            'Здравствуйте!\n\n'
            'Pipeline синхронизации Incus -> Rust завершился с ошибкой.\n\n'
            'Возможные этапы отказа:\n'
            '  - Мониторинг изменений\n'
            '  - Клонирование Incus\n'
            '  - Генерация DTO (финальная валидация)\n'
            '  - Форматирование (rustfmt)\n'
            '  - Публикация PR\n'
            '  - Триггер lab CI\n'
            '  - Обновление состояния\n\n'
            'Сводка:\n'
            f'  - Репозиторий генератора: {repo}\n'
            f'  - Pipeline: {pipeline_url}\n'
            f'  - Коммит генератора: {commit_sha}\n'
            f'  - Ветка: {branch}\n'
            f'  - Коммит Incus: {incus_sha}\n'
            f'  - PR (если успел создаться): {pr_url}\n\n'
            'Требуется анализ логов pipeline.\n\n'
            '--\n'
            'Incus Sync Bot\n'
        )

        msg = EmailMessage()
        msg['Subject'] = subject
        msg['From'] = f'{from_name} <{smtp_user}>'
        msg['To'] = notify_email
        msg.set_content(body)

        ctx = ssl.create_default_context()
        if smtp_port == 465:
            with smtplib.SMTP_SSL(smtp_host, smtp_port, context=ctx) as s:
                s.login(smtp_user, smtp_pass)
                s.send_message(msg)
        else:
            with smtplib.SMTP(smtp_host, smtp_port) as s:
                s.starttls(context=ctx)
                s.login(smtp_user, smtp_pass)
                s.send_message(msg)

        print(f'Failure email sent to {notify_email}')
        "
    when:
      - status: failure
    depends_on:
      - build-parser
      - monitor-changes
      - clone-incus-source
      - generate-models
      - rustfmt-generated
      - publish-pr
      - trigger-lab-ci
      - update-state