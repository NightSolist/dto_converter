[project]
name = "incus-model-sync"
version = "0.1.0"
description = "Automated Go-to-Rust model synchronization for Incus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.1.0",
    "Jinja2>=3.1.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "gitpython>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
incus-sync = "src.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]